# PostKauz mit zwei Diensten auf einem Linux-VPS (A03 S3.5, ADR-009/010):
#   sync      sync --watch --all, kennt die Postfachpasswörter (sync.env)
#   mcp-http  mcp --http, ohne Zugangsdaten, nur auf 127.0.0.1:8787
# Beide teilen ein Volume (Datenbank, Blobs, Log). TLS und das private Netz
# kommen von tailscale serve auf dem Host (oder mit
# docker-compose.tailscale.yml aus einem Tailscale-Sidecar).
# Anleitung: docs/betrieb.md, Abschnitt 4.7 („Docker statt systemd“).
#
#   mkdir -p config                                # config/config.toml anlegen,
#                                                  # Beispiel: docs/betrieb.md, 4.3 Schritt 6
#   install -m 0600 /dev/null sync.env             # POSTKAUZ_PASSWORD_<KONTO>=...
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8787/healthz   # 204
name: postkauz
services:
  sync:
    image: postkauz:${POSTKAUZ_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["sync", "--watch", "--all"]
    env_file:
      - path: ./sync.env
        required: true
    volumes:
      - postkauz-data:/data
      - ./config:/config:ro
    read_only: true
    # SQLite braucht Platz für Temp-Dateien (Wurzel schreibgeschützt).
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  mcp-http:
    image: postkauz:${POSTKAUZ_VERSION:-latest}
    command: ["mcp", "--http"]
    # Kein env_file: Dieser Dienst kennt kein Passwort (ADR-009).
    # Host-Netz, damit [http] listen = "127.0.0.1:8787" auf dem Host
    # lauscht und tailscale serve dorthin weiterreicht (nur Linux).
    network_mode: host
    volumes:
      - postkauz-data:/data
      - ./config:/config:ro
    read_only: true
    # SQLite braucht Platz für Temp-Dateien (Wurzel schreibgeschützt).
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on: [sync]
volumes:
  postkauz-data:
