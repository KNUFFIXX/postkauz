# CI für PostKauz (Arbeitstitel). Bewusst ohne Docker: Integrationstests gegen
# die Testserver laufen vorerst lokal und nachts (make integration), nicht in
# dieser Pipeline. Der Race-Detector läuft als eigener Job mit CGO,
# govulncheck als eigener Job (braucht Netz).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local   # ADR-008: Toolchain ausdrücklich installieren, nie still nachladen

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          # Fehlerzeilen zusätzlich als Annotation: Die ist über die
          # öffentliche API lesbar (check-runs/<id>/annotations), das Log nur
          # mit Anmeldung (Befund 22.10.2026, Lauf zu a93aa9c). GitHub startet
          # bash mit -e und pipefail; deshalb set +e und grep in eine Datei.
          set +e
          go test ./... 2>&1 | tee go-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -e '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:' go-test.log > go-test-fail.log
            msg=$(head -n 40 go-test-fail.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=go test failed::${msg:-see log}"
          fi
          exit "$status"
      - name: guards (no SMTP code, PII gate)
        run: make guard pii-check

  # Race-Detector (P7, ab S1.3): braucht CGO; nur hier, Builds bleiben CGO-frei.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: go test -race
        shell: bash
        run: |
          set +e
          make race 2>&1 | tee go-race.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -e '--- FAIL|^FAIL|panic:|WARNING: DATA RACE|_test\.go:[0-9]+:' go-race.log > go-race-fail.log
            msg=$(head -n 40 go-race-fail.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=go test -race failed::${msg:-see log}"
          fi
          exit "$status"

  # Bekannte Schwachstellen (A01 N2): govulncheck in der Version aus dem Makefile.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: govulncheck
        run: make vuln

  cross:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/postkauz
